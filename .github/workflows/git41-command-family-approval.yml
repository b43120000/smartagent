name: Git41 Same-Task Command Family Approval

on:
  push:
    branches:
      - git41/command-family-approval-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile modified implementation
        run: >-
          python -B -m compileall -q
          source/agent_core/command_family_approval.py
          source/agent_core/resume_command_approval.py
          source/agent_core/webcopilot_resume_dialog.py
          source/RemoteAgent/remote_feature_catalog.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git41_command_family_approval.py
          source/WebAgent/tests/test_git40_software_resume_approval.py
      - name: Git41 task-scoped family matching and Git40 transport approval
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git41_command_family_approval.py
          source/WebAgent/tests/test_git40_software_resume_approval.py -q
      - name: Git39 UNKNOWN_COMMAND boundary and Executor regressions
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git39_unknown_approval_and_finish_recovery.py
          source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py -q
