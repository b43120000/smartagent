name: Case D Baseline Progress Comparison

on:
  push:
    branches:
      - fix/first-full-progress-ccrc-case-d-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline terminal lifecycle - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3ca9f90876e67ca01df290a75d8e26374cd4a94
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unmodified baseline Progress terminal lifecycle
        run: python -B source/WebAgent/tests/validate_progress_terminal_lifecycle.py
