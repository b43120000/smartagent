name: Three-feature Main Integration Offline Gate
on:
  push:
    branches:
      - integration/gar-d1-web-ready-trione-main-20261031
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: source
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      SMARTAGENT_GAR_V1: '0'
      TRI_ONE_TEXT_ONLY_V1: '0'
      TRI_ONE_TASK_RESULT_V1: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r install_smart_agent/requirements-webdirect.txt
      - name: Python compile
        shell: pwsh
        run: |
          python -m compileall -q source/agent_core source/WebAgent source/RemoteAgent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict manifest gate
        shell: pwsh
        run: |
          python -c "from agent_core.protocol_manifest import require_protocol_manifest; r=require_protocol_manifest('.'); print(r); assert r['hash_verification']=='PASS' and r['core_file_count']==207"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared GAR and Tri-One regressions
        shell: pwsh
        run: |
          $tests = @('validate_progress_reply_contract','validate_tri_one_5a_answer_only','validate_tri_one_5a_protocol_it','validate_tri_one_5b_shared_worker','validate_gar_shared_runtime','validate_gar_protocol_loop_it','validate_gar_l4_fresh_context','validate_gar_l4_supervision','validate_composer_stability','validate_composer_operation','validate_runtime_evidence_foundation','validate_evidence_terminal_boundaries','validate_protocol_recovery_readback','validate_narrative_v9_bridge','validate_action_scoped_admission','validate_composer_recovery','validate_startup_protocol_flow','validate_progress_terminal_lifecycle','validate_protocol_interruption_delivery','validate_task_progress','validate_web_ui_contract')
          foreach ($test in $tests) {
            python -B "source/WebAgent/tests/$test.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
