name: Git64 Runtime Test Gateway UT
on:
  push:
    branches:
      - "git64/runtime-test-gateway-20261116"
    paths:
      - "source/agent_core/runtime_test_gateway.py"
      - "source/agent_core/tools.py"
      - "source/agent_core/bounded_process.py"
      - "source/agent_core/turbo_os_broker_client.py"
      - "install_smart_agent/turbo_os_execute.ps1"
      - "collect.bat"
      - "source/WebAgent/tests/test_git64_psdrive_cwd_fallback.py"
      - "source/agent_core/protocol_manifest.py"
      - "config/protocol_manifest.json"
      - "source/WebAgent/tests/test_git64_runtime_test_gateway.py"
      - ".github/workflows/git64-runtime-test-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-gateway-unit:
    name: Runtime gateway / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test gateway Python syntax
        run: python -m py_compile source/agent_core/runtime_test_gateway.py source/WebAgent/tests/test_git64_runtime_test_gateway.py source/WebAgent/tests/test_git64_psdrive_cwd_fallback.py
      - name: Run standalone Runtime gateway policy and dispatch unit tests
        shell: bash
        run: |
          export PYTHONPATH="$PWD/source"
          python -m unittest discover -s source/WebAgent/tests -p "test_git64*.py" -v
      - name: Validate integrity pins used by the test gateway
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path("config/protocol_manifest.json").read_text(encoding="utf-8"))
          for path in (
              "source/agent_core/runtime_test_gateway.py",
              "source/agent_core/bounded_process.py",
              "source/agent_core/tools.py",
              "source/agent_core/protocol_manifest.py",
          ):
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert manifest["core_files"][path]==actual, path
          print("GIT64_GATEWAY_INTEGRITY_PASS")
          PY
      - name: Parse protected PowerShell Broker source using Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'install_smart_agent/turbo_os_execute.ps1'
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          Write-Output 'NATIVE_BROKER_POWERSHELL_PARSE_PASS'
