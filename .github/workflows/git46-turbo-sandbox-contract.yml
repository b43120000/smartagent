name: Git46 Turbo OS Sandbox Contract - NOT OS Attestation

on:
  push:
    branches:
      - git46/turbo-os-sandbox-fail-closed-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-fail-closed-contracts:
    name: Contract tests only (not Windows sandbox PASS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 30
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile Git46 sources
        run: >-
          python -B -m compileall -q
          source/agent_core/turbo_sandbox.py
          source/agent_core/workspace_access.py
          source/agent_core/turbo_execution_policy.py
          source/agent_core/restricted_executor_service.py
          source/agent_core/restricted_executor_client.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/minimal_core_loop.py
          source/agent_core/workspace_manager.py
          source/agent_core/remote_binding_manager.py
          source/agent_core/workspace_turbo_binding.py
          source/agent_core/turbo_settings_command.py
          source/agent_core/executor_run_blackboard.py
      - name: Git46 fail-closed unit contracts
        run: python -B -m pytest source/WebAgent/tests/test_git46_turbo_sandbox_contract.py -q
      - name: Pre-existing non-Turbo Finish regressions
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
          source/WebAgent/tests/test_git42_finish_contract_repair.py -q
      - name: Windows PowerShell parser (NOT OS isolation test)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in @('install_smart_agent/acl_status.ps1',
                                'install_smart_agent/git46_sandbox_api_discovery.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -ne 0) { throw "PowerShell parser errors in $file" }
          }
          Write-Host 'PowerShell sources parsed; OS sandbox unverified.'
      - name: Windows OS API discovery (not isolation attestation)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\\install_smart_agent\\git46_sandbox_api_discovery.ps1 -WorkspaceRoot $env:TEMP
      - name: Security scope notice
        run: echo "Contract checks are not Windows OS Sandbox PASS. No broker or OS isolation attestation exists."

# Real OS isolation acceptance must be a separate fail-hard job after
# provisioning a disposable dedicated Windows identity and NTFS fixture.
# Do not represent mocked or software-rejected operations as kernel ACCESS_DENIED.
