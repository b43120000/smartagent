name: Mainline Hybrid Writer + 5A Offline

on:
  push:
    branches:
      - feat/mainline-hybrid-writer-5a-20261101
      - feat/gar-webgpt2-saved-startup-20261101
      - feat/shared-gar-webgpt2-all-agents-20261101
      - feat/gar-auto-enable-from-webgpt2-20261101
      - feat/gar-split-browser-webgpt1-webgpt2-20261101
      - feat/global-runtime-feature-registry-20261101
      - fix/tri-one-5a-negated-noop-answer-only-20261101
      - main
      - feat/pr-bcd-evidence-adapters-20261102
      - fix/pr-bcd-fact-contract-live-ab-20261103
      - fix/pr-bcd-live-a-first-turn-fact-binding-20261103
      - fix/live-b-p0-scope-20261103
      - feat/tgcmd-20261103
      - feat/tg-cmd-persistent-settings-20261103
      - feat/tg-cmd-acl-off-dev-default-20261103
      - fix/tg-cmd-reuse-telegram-auth-20261103
      - feat/live-b-p1-observation-evidence-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-5a-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PYTHONPATH: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebDirect test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r install_smart_agent/requirements-webdirect.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate exact protocol manifest
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -c "from agent_core.protocol_manifest import validate_protocol_manifest; print(validate_protocol_manifest('.'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Global feature flags defaults, precedence and three-agent inheritance
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_runtime_feature_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hybrid Composer dispatcher, 512 prefix and bulk-tail
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_mainline_hybrid_writer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing Composer fail-closed regression
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_composer_operation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_composer_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PR-0 Assessment contract and V9 safety regression
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_pr0_task_requirement.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 5A Answer-only integration and policy
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_tri_one_5a_protocol_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_tri_one_5a_answer_only.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GAR targeted safe pause, verified L4 and answer-only completion
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m unittest WebAgent.tests.validate_gar_protocol_loop_it.GARProtocolIT.test_unverified_terminal_precondition_is_not_unknown_side_effect WebAgent.tests.validate_gar_protocol_loop_it.GARProtocolIT.test_l4_invalid_proof_never_switches_planner WebAgent.tests.validate_gar_protocol_loop_it.GARProtocolIT.test_l4_fresh_planner_can_complete_text_only_goal WebAgent.tests.validate_gar_protocol_loop_it.GARProtocolIT.test_gar_off_keeps_legacy_repeated_rejection_pause WebAgent.tests.validate_gar_protocol_loop_it.GARProtocolIT.test_duplicate_invalid_fresh_planner_reply_bounded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GAR Progress Repair held-action handoff and continuation safety
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_gar_progress_hold_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GAR saved WebGPT1/WebGPT2 startup regression
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_gar_saved_startup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_gar_l4_fresh_context.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dual browser roles and GAR L4 non-interference
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_dual_browser_roles.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -B source/WebAgent/tests/validate_gar_l4_supervision.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
