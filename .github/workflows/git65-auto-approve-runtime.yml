name: Git65 Auto Approve Runtime Regression
on:
  push:
    branches:
      - "git65/acl-off-auto-approve-runtime"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-approve:
    name: ACL/Turbo/Auto Approve / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile changed Runtime and ingress modules
        run: >-
          python -B -m compileall -q
          source/agent_core/auto_approve_mode.py
          source/agent_core/workspace_access.py
          source/agent_core/tools.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/RemoteAgent/telegram_transport.py
          source/agent_core/remote_binding_manager.py
          source/agent_core/workspace_manager.py
          source/WebAgent/tests/test_git65_auto_approve.py
      - name: Verify protocol/source integrity
        shell: bash
        run: |
          python - <<'PY'
          from agent_core.protocol_manifest import validate_protocol_manifest
          result = validate_protocol_manifest(".")
          assert result["hash_verification"] == "PASS", result
          print("GIT65_PROTOCOL_INTEGRITY_PASS")
          PY
      - name: Validate ACL transition PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'install_smart_agent/acl_status.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host 'GIT65_ACL_TRANSITION_POWERSHELL_PARSE_PASS'
      - name: Eight-mode regression and actual CMD/BAT process IT on Windows
        run: python -B -m unittest source.WebAgent.tests.test_git65_auto_approve -v
      - name: Existing Turbo, admission and Tool Result regressions
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git49_turbo_broker_admission.py
          source/WebAgent/tests/test_git50_turbo_broker_dispatch.py
          source/WebAgent/tests/test_git52_native_broker_full_access_approval.py
          source/WebAgent/tests/test_git54_runtime_evidence_transparency.py
          source/WebAgent/tests/test_git64_runtime_test_gateway.py
