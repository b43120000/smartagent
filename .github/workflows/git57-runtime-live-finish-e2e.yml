name: Git57 Runtime Live Finish E2E

on:
  push:
    branches:
      - git57/live-e2e-finish-repair-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-runner:
    name: Git57 Runtime E2E / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile Git57 and Git56/55 runtime files
        run: >-
          python -B -m compileall -q
          source/agent_core/git57_live_finish_injector.py
          source/WebAgent/tests/git57_live_e2e.py
          source/WebAgent/tests/test_git57_live_finish_injector.py
          source/agent_core/requirement_goal_state.py
          source/agent_core/runtime_finish_comparator.py
          source/WebAgent/pokeclaw_executor_loop.py
      - name: Git57/56/55 inherited regressions
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git57_live_finish_injector.py
          source/WebAgent/tests/test_git56_finish_semantic_repair.py
          source/WebAgent/tests/test_git55_requirement_goal_state_contract.py
          source/WebAgent/tests/test_git54_runtime_evidence_transparency.py
      - name: Windows real Runtime observation and recovered Finish
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/git57_live_e2e.py --workspace "$env:RUNNER_TEMP" --target (Join-Path $env:RUNNER_TEMP 'GIT57_LIVE_NONEXISTENT_CI_RECOVER') --progress-root . --scenario recover
      - name: Windows real Runtime observation and exhausted Finish
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/git57_live_e2e.py --workspace "$env:RUNNER_TEMP" --target (Join-Path $env:RUNNER_TEMP 'GIT57_LIVE_NONEXISTENT_CI_EXHAUST') --progress-root . --scenario exhaust
      - name: Windows Native launcher compile
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -Path 'install_smart_agent/turbo_appcontainer_probe.cs' -ErrorAction Stop
