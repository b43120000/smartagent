name: NLIT Private Capture Regression

on:
  push:
    branches:
      - fix/nlit-evidence-20261024-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-and-evidence:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: source
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test private capture without browser, CDP or runtime
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".codex/nlit_private_capture"
          python -m unittest discover -s .codex/nlit_private_capture -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install existing protocol test dependencies
        run: python -m pip install -r install_smart_agent/requirements-webdirect.txt
      - name: Offline observer static checks and production import hook
        shell: pwsh
        run: |
          python -m compileall -q .codex/nlit_private_capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null; $errors = $null
          $scriptPath = Join-Path (Get-Location) '.codex/nlit_private_capture/Invoke-NlitIsolated.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.ErrorId }; exit 1 }
          $env:PYTHONPATH = 'source;.codex/nlit_private_capture'
          $env:SMARTAGENT_REMOTE_WORKER = '1'
          $env:SMARTAGENT_NLIT_CAPTURE_ENABLED = '1'
          $env:SMARTAGENT_NLIT_PRIVATE_ACL_CONFIRMED = 'YES'
          python -c "from WebAgent.protocol_loop import WebAgentProtocolLoop; from WebAgent.browser_client import WebAgentBrowserClient; from agent_core.web_runtime import WebLLMScraper; import private_capture; assert all(hasattr(m,'__wrapped__') for m in (WebAgentProtocolLoop._run_impl, WebAgentBrowserClient.ask, WebLLMScraper._write_prompt_to_composer, WebLLMScraper._log_stage)); print('NLIT_REAL_WORKER_HOOK_IMPORT_PASS')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Existing evidence and startup regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "source"
          python source/WebAgent/tests/validate_evidence_terminal_boundaries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/WebAgent/tests/validate_runtime_evidence_foundation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/WebAgent/tests/validate_vpcs_expected_outcome.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/WebAgent/tests/validate_startup_protocol_flow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from agent_core.protocol_manifest import validate_protocol_manifest; r=validate_protocol_manifest('.'); print(r); assert r['hash_verification']=='PASS'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
