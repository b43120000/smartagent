name: Git71 Timeout Reconciliation Recovery UT + Real Executor IT
on:
  push:
    branches: [git71/timeout-reconciliation-end-to-end]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Protocol manifest gate
        run: >-
          python -B -c "from agent_core.protocol_manifest import require_protocol_manifest;
          x=require_protocol_manifest('.'); assert x['status']=='PASS'
          and x['hash_verification']=='PASS', x"
      - name: Syntax compile
        run: >-
          python -B -m compileall -q source/agent_core/runtime_open_fidelity_it.py source/agent_core/runtime_goal_evidence_it.py source/agent_core/timeout_reconciliation.py source/agent_core/bounded_process.py source/agent_core/runtime_finish_comparator.py source/agent_core/goal_evidence_matching.py source/agent_core/shell_execution.py
          source/agent_core/tools.py source/agent_core/smartagent_protocol.py
          source/agent_core/executor_command_rca.py
          source/WebAgent/minimal_admission.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git69_execution_fidelity.py
          source/WebAgent/tests/test_git69_open_execution_it.py source/WebAgent/tests/test_git70_goal_evidence.py source/WebAgent/tests/test_git70_open_goal_evidence_it.py source/WebAgent/tests/test_git71_timeout_reconciliation.py source/WebAgent/tests/test_git71_timeout_pipeline_it.py
      - name: UT and Windows sidecar process IT
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git69_execution_fidelity.py
          source/WebAgent/tests/test_git69_open_execution_it.py
          source/WebAgent/tests/test_git68_open_mode_pipeline.py
          source/WebAgent/tests/test_git70_goal_evidence.py
          source/WebAgent/tests/test_git70_open_goal_evidence_it.py
          source/WebAgent/tests/test_git71_timeout_reconciliation.py
          source/WebAgent/tests/test_git71_timeout_pipeline_it.py
          --tb=short
          --junitxml=git71-evidence.xml
      - name: Release file manifest integrity gate
        run: >-
          python -B -c "import json,runpy; from pathlib import Path;
          build=runpy.run_path('install_smart_agent/build_update_manifest.py')['build'];
          generated=build(Path('.'));
          recorded=json.loads(Path('config/update_manifest.json').read_text(encoding='utf-8'));
          assert generated['files']==recorded['files'],
          {'expected':len(generated['files']),'actual':len(recorded['files']),
          'manifest_delta':{k:v for k,v in generated['files'].items() if recorded['files'].get(k)!=v},
          'extra_pins':[k for k in recorded['files'] if k not in generated['files']]};
          assert generated['release_sequence']==recorded['release_sequence'],
          'RELEASE_SEQUENCE_MISMATCH'"
      - name: Pinned checkout upgrade preflight
        run: >-
          python -B -c "from pathlib import Path; import subprocess;
          from agent_core.force_stop_all_agents import _verify_upgrade_commit;
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
          _verify_upgrade_commit(Path('.'),sha)"
      - name: Publish CI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git71-evidence-${{ matrix.os }}
          path: |
            git71-evidence.xml
            localdata/runtime/open_execution_fidelity_it/TASK-G69IT-*.json
            git69-ci-evidence/*.json
            localdata/runtime/goal_evidence_matching/TASK-*.jsonl
            localdata/runtime/goal_evidence_it/TASK-*.json
            git70-ci-evidence/*.json
            git71-ci-evidence/*.json
            localdata/runtime/timeout_reconciliation/TASK-G71IT-*.jsonl
          if-no-files-found: warn
