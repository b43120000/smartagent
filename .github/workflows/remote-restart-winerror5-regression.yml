name: RemoteAgent Restart WinError5 Regression

on:
  push:
    branches:
      - fix/remote-restart-winerror5-breakaway-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Restart and ForceStop - ${{ matrix.os }} - Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 20
    env:
      PYTHONPATH: source
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile restart and ForceStop modules
        run: >
          python -B -m compileall -q
          source/RemoteAgent/remote_restart.py
          source/agent_core/force_stop_all_agents.py
          source/agent_core/force_stop_cleanup.py
          source/agent_core/remote_clean_start.py
          source/WebAgent/tests/test_remote_restart_winerror5.py
          source/WebAgent/tests/validate_force_stop_owned_cleanup.py
      - name: WinError5 restart flag regression
        run: python -W error::SyntaxWarning -B source/WebAgent/tests/test_remote_restart_winerror5.py
      - name: ForceStop local checkout regression
        run: python -W error::SyntaxWarning -B source/WebAgent/tests/validate_force_stop_owned_cleanup.py
      - name: Existing Auto RCA regression
        run: python -W error::SyntaxWarning -B source/WebAgent/tests/test_auto_rca_upload.py
      - name: Verify source SHA256 manifest
        run: >
          python -B -c "import hashlib,json,pathlib;
          m=json.loads(pathlib.Path('config/protocol_manifest.json').read_text(encoding='utf-8'));
          paths=['source/RemoteAgent/remote_restart.py',
          'source/agent_core/protocol_manifest.py',
          'source/agent_core/force_stop_all_agents.py',
          'source/agent_core/force_stop_cleanup.py',
          'source/agent_core/remote_clean_start.py'];
          bad=[p for p in paths if m['core_files'].get(p)!=hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()];
          print('MANIFEST_MISMATCHES:',bad);
          assert not bad,bad"
