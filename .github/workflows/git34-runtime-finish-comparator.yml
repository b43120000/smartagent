name: Git34 Runtime Finish Comparator and Tri-One Final Acceptance

on:
  push:
    branches:
      - git34/runtime-finish-comparator-trione-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-comparator:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile core
        run: >-
          python -B -m compileall -q
          source/agent_core/runtime_finish_comparator.py
          source/agent_core/executor_run_blackboard.py
          source/agent_core/tri_one_runtime_terminal.py
          source/agent_core/tri_one_task_result.py
          source/agent_core/task_continuation.py
          source/WebAgent/minimal_decision.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
      - name: Git34 comparator and negative goal tests
        run: python -B -m pytest source/WebAgent/tests/test_git34_runtime_finish_comparator.py -q
      - name: Git33 executor compatibility
        run: python -B -m pytest source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py -q
      - name: Legacy fact and three-one egress tests
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git31_single_fact_query_terminal.py
          source/WebAgent/tests/test_tri_one_egress_v10.py
          source/WebAgent/tests/test_minimal_core_v10.py
          -q
