name: Git40 Software Pre-Resume Approval (Telegram and WebCopilot)

on:
  push:
    branches:
      - git40/resume-preapproval-telegram-webcopilot-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile modified implementation
        run: >-
          python -B -m compileall -q
          source/agent_core/resume_command_approval.py
          source/agent_core/webcopilot_resume_dialog.py
          source/agent_core/task_continuation.py
          source/agent_core/security_approval.py
          source/RemoteAgent/telegram_transport.py
          source/RemoteAgent/telegram_listener.py
          source/RemoteAgent/telegram_webagent_worker.py
          source/RemoteAgent/remote_feature_catalog.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/web_copilot.py
          source/WebAgent/tests/test_git40_software_resume_approval.py
      - name: Git40 software pre-resume consent, transport separation, once-only consumption
        run: python -B -m pytest source/WebAgent/tests/test_git40_software_resume_approval.py -q
      - name: Git39 unknown command and Finish comparator
        run: python -B -m pytest source/WebAgent/tests/test_git39_unknown_approval_and_finish_recovery.py -q
      - name: Git38 enum and historical admission RCA
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git38_generic_enum_repair.py
          source/WebAgent/tests/test_git37_action_admission_repair.py
          source/WebAgent/tests/test_git37_executor_admission_collector.py -q
      - name: Git33-Git36 minimal Executor regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
          source/WebAgent/tests/test_git35_dynamic_finish_contract.py
          source/WebAgent/tests/test_git36_unified_finish_evidence.py -q
      - name: WebCopilot startup and route
        run: python -B -m pytest source/WebAgent/tests/test_other_webcopilot_startup.py -q
      - name: Telegram transport and software controls
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_tri_one_egress_v10.py
          source/WebAgent/tests/test_minimal_core_v10.py -q
