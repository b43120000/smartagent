name: Git68 System-Wide Runtime + Blackboard + Handoff UT Audit

on:
  push:
    branches: [git68/finish-contract-adapter-v2]
    paths:
      - '.github/workflows/git68-system-wide-runtime-ut.yml'
      - 'source/**'
      - 'install_smart_agent/tests/**'
      - 'config/protocol_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-offline-unit-suite:
    name: Full offline UT / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      SMARTAGENT_TEST_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test and coverage dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-cov playwright
      - name: Prepare Windows synthetic collector venv
        if: runner.os == 'Windows'
        run: python -m venv .venv
      - name: Restore tracked .venv gitignore for source integrity
        if: runner.os == 'Windows'
        run: >-
          python -B -c "import subprocess; from pathlib import Path;
          Path('.venv/.gitignore').write_bytes(subprocess.check_output(
          ['git','show','HEAD:.venv/.gitignore']))"
      - name: Compile all Python modules and tests
        run: >-
          python -B -m compileall -q
          source/agent_core source/WebAgent source/RemoteAgent
          install_smart_agent/tests
      - name: Verify entire frozen source manifest
        run: >-
          python -B -c "from agent_core.protocol_manifest import
          require_protocol_manifest; r=require_protocol_manifest('.');
          assert r['status']=='PASS' and r['hash_verification']=='PASS'
          and not r['hash_mismatches'],r; print(r)"
      - name: Collect entire offline UT suite
        run: >-
          python -B -m pytest --collect-only -q
          source/WebAgent/tests
          source/agent_core/web_ui/tests
          install_smart_agent/tests
      - name: Run complete discovered UT suite, emit executable coverage
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests
          source/agent_core/web_ui/tests
          install_smart_agent/tests
          --tb=short --durations=20
          --junitxml=git68-full-ut-results.xml
          --cov=agent_core --cov=WebAgent --cov=RemoteAgent
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=json:git68-full-ut-coverage.json
      - name: Upload exact result and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git68-full-ut-${{ matrix.os }}
          path: |
            git68-full-ut-results.xml
            git68-full-ut-coverage.json
          if-no-files-found: warn
