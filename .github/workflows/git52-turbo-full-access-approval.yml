name: Git52 Native Turbo Scoped Full Access Approval Regression

on:
  push:
    branches:
      - git52/turbo-full-access-approval-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git52-regressions:
    name: Git52 and Git32-Git50 regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile Git52 modules
        run: >-
          python -B -m compileall -q
          source/agent_core/command_security.py
          source/agent_core/windows_security.py
          source/agent_core/turbo_execution_policy.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git52_native_broker_full_access_approval.py
          source/WebAgent/tests/test_git52_native_command_trust_replan.py
      - name: Git52 scoped Native Broker no-popup regressions
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git52_native_broker_full_access_approval.py
          source/WebAgent/tests/test_git52_native_command_trust_replan.py
          source/WebAgent/tests/test_git52_collector_native_block_diagnostics.py
      - name: Validate collect.bat PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $script = [IO.File]::ReadAllText('collect.bat')
          $marker = '# POWERSHELL_BEGIN'
          $index = $script.LastIndexOf($marker, [StringComparison]::Ordinal)
          if ($index -lt 0) { throw 'Git52 collector marker missing' }
          [ScriptBlock]::Create($script.Substring($index + $marker.Length)) | Out-Null
      - name: Git32 PowerShell and workspace regressions
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git32_turbo_broker_process_environment.py
          source/WebAgent/tests/test_git32_turbo_native_broker_stderr_diagnostics.py
          source/WebAgent/tests/test_git32_turbo_command_rejection_diagnostics.py
          source/WebAgent/tests/test_git32_turbo_workspace_context_repair.py
      - name: Git49-Git50 Native Broker and scope regression
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git49_turbo_broker_admission.py
          source/WebAgent/tests/test_git50_turbo_broker_dispatch.py
          source/WebAgent/tests/test_git50_turbo_planning_hints.py
          source/WebAgent/tests/test_git50_turbo_runtime_provenance.py
      - name: Git39 unknown-command approval compatibility
        run: python -B -m pytest -q source/WebAgent/tests/test_git39_unknown_approval_and_finish_recovery.py
