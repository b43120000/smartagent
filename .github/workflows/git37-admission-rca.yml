name: Git37 Action Admission Diagnostics and RCA Collector

on:
  push:
    branches:
      - git37/action-admission-schema-repair-rca-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-rca:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile modified Python
        run: >-
          python -B -m compileall -q
          source/WebAgent/minimal_admission.py
          source/WebAgent/minimal_core_loop.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git37_action_admission_repair.py
          source/WebAgent/tests/test_git37_executor_admission_collector.py
      - name: Git37 Action Admission diagnostics and safe repair
        run: python -B -m pytest source/WebAgent/tests/test_git37_action_admission_repair.py -q
      - name: Git37 actual Windows Collector and export completeness
        run: python -B -m pytest source/WebAgent/tests/test_git37_executor_admission_collector.py -q
      - name: Git26 and Git27 collector regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git26_minimal_collector_live_rca.py
          source/WebAgent/tests/test_git27_collector_causal_coverage.py -q
      - name: Git33 to Git36 primary executor regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
          source/WebAgent/tests/test_git35_dynamic_finish_contract.py
          source/WebAgent/tests/test_git36_unified_finish_evidence.py -q
      - name: Original Tri-One and minimal core regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git31_single_fact_query_terminal.py
          source/WebAgent/tests/test_tri_one_egress_v10.py
          source/WebAgent/tests/test_minimal_core_v10.py -q
