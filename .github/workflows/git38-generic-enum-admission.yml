name: Git38 Generic Enum Contract & PokeClaw Admission Events

on:
  push:
    branches:
      - git38/generic-operation-enum-contract-repair-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile modified Python
        run: >-
          python -B -m compileall -q
          source/agent_core/tool_contract_metadata.py
          source/agent_core/runtime_finish_comparator.py
          source/WebAgent/minimal_admission.py
          source/WebAgent/minimal_core_loop.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git38_generic_enum_repair.py
      - name: Git38 dynamic enum and admission-event semantics
        run: python -B -m pytest source/WebAgent/tests/test_git38_generic_enum_repair.py -q
      - name: Git37 admission contracts and Windows RCA collector
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git37_action_admission_repair.py
          source/WebAgent/tests/test_git37_executor_admission_collector.py -q
      - name: Git26 and Git27 collector regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git26_minimal_collector_live_rca.py
          source/WebAgent/tests/test_git27_collector_causal_coverage.py -q
      - name: Git33-Git36 Executor Finish and Tri-One regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
          source/WebAgent/tests/test_git35_dynamic_finish_contract.py
          source/WebAgent/tests/test_git36_unified_finish_evidence.py -q
      - name: Earlier minimal and terminal regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git31_single_fact_query_terminal.py
          source/WebAgent/tests/test_tri_one_egress_v10.py
          source/WebAgent/tests/test_minimal_core_v10.py -q
