name: Evidence Foundation Regression

on:
  push:
    branches:
      - fix/evidence-terminal-boundary
      - feat/pr-bcd-evidence-adapters-20261102
      - fix/pr-bcd-fact-contract-live-ab-20261103
      - fix/pr-bcd-live-a-first-turn-fact-binding-20261103
      - fix/live-b-p0-scope-20261103
      - feat/tgcmd-20261103
      - feat/tg-cmd-persistent-settings-20261103
      - feat/tg-cmd-acl-off-dev-default-20261103
      - fix/tg-cmd-reuse-telegram-auth-20261103
      - feat/live-b-p1-observation-evidence-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-boundaries:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: source
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebAgent protocol dependencies
        run: python -m pip install -r install_smart_agent/requirements-webdirect.txt
      - name: Evidence Foundation and terminal boundary regressions
        shell: pwsh
        run: |
          python source/WebAgent/tests/validate_evidence_terminal_boundaries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/WebAgent/tests/validate_runtime_evidence_foundation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/WebAgent/tests/validate_vpcs_expected_outcome.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/WebAgent/tests/validate_startup_protocol_flow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from agent_core.protocol_manifest import validate_protocol_manifest; print(validate_protocol_manifest('.'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
