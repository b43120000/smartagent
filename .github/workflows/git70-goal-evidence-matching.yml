name: Git70 Universal Goal Evidence Matching and Recovery UT + Real IT
on:
  push:
    branches: [git70/universal-goal-evidence-matching-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Protocol manifest gate
        run: >-
          python -B -c "from agent_core.protocol_manifest import require_protocol_manifest;
          x=require_protocol_manifest('.'); assert x['status']=='PASS'
          and x['hash_verification']=='PASS', x"
      - name: Syntax compile
        run: >-
          python -B -m compileall -q source/agent_core/runtime_open_fidelity_it.py source/agent_core/runtime_goal_evidence_it.py source/agent_core/goal_evidence_matching.py source/agent_core/shell_execution.py
          source/agent_core/tools.py source/agent_core/smartagent_protocol.py
          source/agent_core/executor_command_rca.py
          source/WebAgent/minimal_admission.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git69_execution_fidelity.py
          source/WebAgent/tests/test_git69_open_execution_it.py source/WebAgent/tests/test_git70_goal_evidence.py source/WebAgent/tests/test_git70_open_goal_evidence_it.py
      - name: UT and Windows sidecar process IT
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git69_execution_fidelity.py
          source/WebAgent/tests/test_git69_open_execution_it.py
          source/WebAgent/tests/test_git68_open_mode_pipeline.py
          source/WebAgent/tests/test_git70_goal_evidence.py
          source/WebAgent/tests/test_git70_open_goal_evidence_it.py
          --tb=short
          --junitxml=git70-evidence.xml
      - name: Publish CI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git70-evidence-${{ matrix.os }}
          path: |
            git70-evidence.xml
            localdata/runtime/open_execution_fidelity_it/TASK-G69IT-*.json
            git69-ci-evidence/*.json
            localdata/runtime/goal_evidence_matching/TASK-*.jsonl
            localdata/runtime/goal_evidence_it/TASK-*.json
            git70-ci-evidence/*.json
          if-no-files-found: warn
