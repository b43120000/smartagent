name: PR-A Requirement Graph Durable Ledger Regression

on:
  push:
    branches:
      - feat/prerequisite-v3-pr-a-graph-ledger-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-a-windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: source
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare SmartAgent bundled runtime paths for isolated CI
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitRoot = Join-Path $env:ProgramFiles "Git"
          if (-not (Test-Path (Join-Path $gitRoot "cmd\git.exe"))) {
            throw "Windows runner Git binary not found"
          }
          New-Item -ItemType Junction -Path ".venv\git" -Target $gitRoot -Force | Out-Null
          .\.venv\Scripts\python.exe --version
          .\.venv\git\cmd\git.exe --version
      - name: Install WebDirect dependencies
        shell: pwsh
        run: |
          python -m pip install -r install_smart_agent/requirements-webdirect.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PR-A DAG and durable ledger regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_pr_a_requirement_graph.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing collect.bat sanitized PR-A bundle smoke
        shell: pwsh
        run: |
          $sample = @'
          from agent_core.prerequisite_graph_v3 import RequirementLedger, build_requirement_graph
          from agent_core.task_requirement import assess_task_requirement
          graph = build_requirement_graph(
              task_id="TASK-PR-A-CI", request_id="RR-PR-A-CI", task_epoch="epoch-ci",
              assessment=assess_task_requirement("Review GitHub PR #42")
          )
          RequirementLedger(".").initialize(graph)
          '@
          $sample | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd.exe /c "collect.bat TASK-PR-A-CI RR-PR-A-CI"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem -Path ".\localdata\diagnostics\gar_live_rca" -Filter "*TASK-PR-A-CI.zip" | Select-Object -First 1
          if (-not $zip) { throw "Collector ZIP missing" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath ".\localdata\pr_a_ci_bundle" -Force
          $summaryFile = ".\localdata\pr_a_ci_bundle\pr_a_requirement_ledger_summary.json"
          if (-not (Test-Path $summaryFile)) { throw "Collector PR-A summary missing" }
          $summary = Get-Content -LiteralPath $summaryFile -Raw | ConvertFrom-Json
          if (-not $summary.found -or $summary.node_count -lt 1) {
            throw "Collector failed to summarize the real PR-A ledger"
          }
      - name: PR-0 routing and task requirement regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_pr0_task_requirement.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V9 and GAR Progress Repair regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_tri_one_5a_protocol_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_gar_progress_hold_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency loop and manifest integrity regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_runtime_dependency_loop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -c "from agent_core.protocol_manifest import validate_protocol_manifest; print(validate_protocol_manifest('.'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
