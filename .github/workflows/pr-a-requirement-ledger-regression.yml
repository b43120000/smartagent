name: Repair Stagnation Effective Progress Windows Regression

on:
  push:
    branches:
      - fix/gar-progress-collector-l4-control-20261102
      - release/pr-a-gar-l4-default-off-20261102
      - fix/repair-stall-effective-progress-20261102
      - feat/request-first-workspace-routing-20261102
      - feat/prerequisite-v3-prb-prc-prd-20261102
      - fix/pr-bcd-project-environment-20261102
      - fix/pr-bcd-live-observation-terminal-20261102
      - feat/pr-bcd-evidence-adapters-20261102
      - fix/pr-bcd-fact-contract-live-ab-20261103
      - fix/pr-bcd-live-a-first-turn-fact-binding-20261103
      - fix/live-b-p0-scope-20261103
      - feat/tgcmd-20261103
      - feat/tg-cmd-persistent-settings-20261103
      - feat/tg-cmd-acl-off-dev-default-20261103
      - fix/tg-cmd-reuse-telegram-auth-20261103
      - feat/live-b-p1-observation-evidence-20261103
      - fix/live-b-p1-progress-terminal-r17-20261103
      - fix/pr-b-foundation-reuse-auth-integrity-20261103
      - fix/collect-telegram-terminal-evidence-20261103
      - fix/pr-b-goal-driven-live-rca-r18-20261103
      - feat/scr-v1-semantic-capability-resolution-20261104
  pull_request:
    branches:
      - fix/live-b-p1-progress-terminal-r17-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-a-windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: source
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare SmartAgent bundled runtime paths for isolated CI
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitRoot = Join-Path $env:ProgramFiles "Git"
          if (-not (Test-Path (Join-Path $gitRoot "cmd\git.exe"))) {
            throw "Windows runner Git binary not found"
          }
          New-Item -ItemType Junction -Path ".venv\git" -Target $gitRoot -Force | Out-Null
          .\.venv\Scripts\python.exe --version
          .\.venv\git\cmd\git.exe --version
      - name: Install WebDirect dependencies
        shell: pwsh
        run: |
          python -m pip install -r install_smart_agent/requirements-webdirect.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PR-B/C/D scoped probe and independent verification regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_pr_bcd_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_bcd_fact_contract_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_bcd_live_b_p0_scope_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_bcd_live_b_p1_evidence_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_bcd_b_p1_terminal_r17.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_telegram_direct_cmd_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_telegram_cmd_shared_auth_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_telegram_cmd_acl_modes_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_tool_scope_hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_semantic_capability_resolution_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_semantic_capability_protocol_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_bcd_gar_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_bcd_project_environment_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_pr_b_foundation_reuse_integrity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_evidence_terminal_boundaries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_result_evidence_to_action_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh-install ACL OFF default and opt-in contract
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install_smart_agent/tests/validate_installer_acl_opt_in.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_acl_off_software_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare offline PR-B/C/D Live fixture (no install or network)
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/prepare_pr_bcd_live_fixture.py --root ".\\localdata\\SmartAgent_PR_BCD_LIVE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = ".\\localdata\\SmartAgent_PR_BCD_LIVE"
          if (-not (Test-Path "$target\\wheelhouse\\smartagent_pr_bcd_live-1.0-py3-none-any.whl")) {
            throw "Synthetic wheel missing"
          }
          $check = python -I -B "$target\\inspect_dependency.py"
          if ($LASTEXITCODE -ne 0 -or -not ($check -match "PR_BCD_DEPENDENCY_MISSING")) {
            throw "Fixture unexpectedly has preinstalled dependency"
          }
      - name: PR-A DAG and durable ledger regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_pr_a_requirement_graph.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Telegram terminal ZIP collector regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_collect_telegram_terminal_rca.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing collect.bat sanitized PR-A bundle smoke
        shell: pwsh
        run: |
          $sample = @'
          from agent_core.prerequisite_graph_v3 import RequirementLedger, build_requirement_graph
          from agent_core.task_requirement import assess_task_requirement
          from agent_core.prerequisite_runtime_v3 import RecoveryLedger, probe_requirements
          graph = build_requirement_graph(
              task_id="TASK-PR-A-CI", request_id="RR-PR-A-CI", task_epoch="epoch-ci",
              assessment=assess_task_requirement("Review GitHub PR #42")
          )
          RequirementLedger(".").initialize(graph)
          probe = probe_requirements(
              request="Read only GitHub PR #42", authorized_paths=[],
              environment_snapshot={"tools":{
                  "python":{"status":"AVAILABLE","version":"Python 3.11.7"},
                  "git":{"status":"AVAILABLE","version":"git version 2.43.1"}
              }}, install_root=".",
          )
          RecoveryLedger(".").initialize(
              task_id="TASK-PR-A-CI",request_id="RR-PR-A-CI",
              task_epoch="epoch-ci",intent_sha256="a"*64,
              probe=probe,graph_digest="b"*64,
          )
          '@
          $sample | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fakeEvents = @'
          import json
          from pathlib import Path
          root = Path('localdata')
          log = root/'logs'/'remote_runtime.jsonl'
          log.parent.mkdir(parents=True, exist_ok=True)
          task, request = "TASK-PR-A-CI","RR-PR-A-CI"
          events = [
              dict(timestamp=1793510000.1,event="STATUS",stage="pr_a_graph_initialized",task_id=task,request_id=request,revision=1,node_count=5),
              dict(timestamp=1793510001.2,event="STATUS",stage="protocol_rejected",task_id=task,request_id=request,round=1,diagnostics=[{"reason":"invalid_progress_payload","field_issues":[{"field":"steps.status","code":"INVALID_STEP_STATUS","detail":"SENSITIVE_SENTINEL"}]}]),
              dict(timestamp=1793510002.3,event="STATUS",stage="gar_checkpoint_persisted",task_id=task,request_id=request,round=1,checkpoint_name="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.json"),
              dict(timestamp=1793510003.4,event="STATUS",stage="pr_a_action_bound",task_id=task,request_id=request,action_id="ACT-CI-1",revision=2),
              dict(timestamp=1793510004.5,event="STATUS",stage="tool_started",task_id=task,request_id=request,action_id="ACT-CI-1",tool="read_file",command="SENSITIVE_SENTINEL"),
              dict(timestamp=1793510005.6,event="STATUS",stage="planner_response_received",task_id=task,request_id=request,response="SENSITIVE_SENTINEL"),
          ]
          with log.open('a',encoding='utf-8') as f:
              for ev in events: f.write(json.dumps(ev)+'\n')
          snaps = root/'runtime'/'gar_snapshots'
          snaps.mkdir(parents=True,exist_ok=True)
          (snaps/('a'*40+'.json')).write_text(json.dumps({"schema":"SMARTAGENT_GAR_SNAPSHOT_V1","recovery_budget":{"rejected_rounds":1,"rebases":0,"replans":0,"fresh_sessions":0},"pending_operations":[],"checkpoint":{"verified_evidence":[]},"verification_preconditions":[],"blockers":[]}))
          '@
          $fakeEvents | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd.exe /c "collect.bat TASK-PR-A-CI RR-PR-A-CI"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem -Path ".\localdata\diagnostics\gar_live_rca" -Filter "*TASK-PR-A-CI.zip" | Select-Object -First 1
          if (-not $zip) { throw "Collector ZIP missing" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath ".\localdata\pr_a_ci_bundle" -Force
          $summaryFile = ".\localdata\pr_a_ci_bundle\pr_a_requirement_ledger_summary.json"
          if (-not (Test-Path $summaryFile)) { throw "Collector PR-A summary missing" }
          $summary = Get-Content -LiteralPath $summaryFile -Raw | ConvertFrom-Json
          if (-not $summary.found -or $summary.node_count -lt 1) {
            throw "Collector failed to summarize the real PR-A ledger"
          }
          if (-not $summary.nodes -or $summary.nodes.Count -ne $summary.node_count) {
            throw "Collector DAG edge summary missing"
          }
          $bcdFile = ".\localdata\pr_a_ci_bundle\pr_bcd_recovery_summary.json"
          if (-not (Test-Path $bcdFile)) { throw "PR-B/C/D collector summary missing" }
          $bcd = Get-Content -LiteralPath $bcdFile -Raw | ConvertFrom-Json
          if (-not $bcd.found -or $bcd.phase -ne "PROBED" -or $bcd.revision -ne 1) {
            throw "PR-B/C/D collector reported invalid durable recovery state"
          }
          $timeline = Get-Content -LiteralPath ".\localdata\pr_a_ci_bundle\timeline.json" -Raw | ConvertFrom-Json
          if (-not ($timeline | Where-Object { $_.event -eq 'protocol_rejected' -and $_.stage -eq 'protocol_rejected' })) {
            throw "Collector failed to resolve RemoteAgent STATUS/stage event"
          }
          if (-not ($timeline | Where-Object { $_.event -eq 'tool_started' -and $_.action_id -eq 'ACT-CI-1' })) {
            throw "Collector lost Action/Tool identity"
          }
          if (-not ($timeline | Where-Object { $_.event -eq 'protocol_rejected' -and $_.diagnostic_reasons -contains 'invalid_progress_payload' })) {
            throw "Collector lost bounded Progress diagnostic codes"
          }
          $snaps = Get-Content -LiteralPath ".\localdata\pr_a_ci_bundle\gar_snapshot_summaries.json" -Raw | ConvertFrom-Json
          if (@($snaps).Count -ne 1) { throw "Collector failed to correlate GAR checkpoint" }
          $manifest = Get-Content -LiteralPath ".\localdata\pr_a_ci_bundle\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'SMARTAGENT_LIVE_RCA_V2' -or $manifest.event_count -lt 6) {
            throw "Collector V2 manifest incomplete"
          }
          $stageRaw = Get-ChildItem ".\localdata\pr_a_ci_bundle" -File |
             ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw } | Out-String
          if ($stageRaw.Contains('SENSITIVE_SENTINEL')) {
            throw "Collector leaked unredacted prompt/command/diagnostic detail"
          }
      - name: PR-0 routing and task requirement regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_pr0_task_requirement.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V9 and GAR Progress Repair regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_tri_one_5a_protocol_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_gar_progress_hold_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency loop and manifest integrity regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_runtime_dependency_loop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -c "from agent_core.protocol_manifest import validate_protocol_manifest; print(validate_protocol_manifest('.'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evidence-backed repair stagnation and sanitized status regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_repair_stagnation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Request-first workspace and three-task context routing regression
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_request_first_workspace_routing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_dynamic_task_transport_binding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_multi_workspace_access.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_authorized_path_extraction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_task_continuation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GAR R1 local handoff and R3 L4 independent controls
        shell: pwsh
        run: |
          python -B source/WebAgent/tests/validate_gar_r1_r3_controls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_gar_shared_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_gar_protocol_loop_it.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_gar_l4_supervision.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B source/WebAgent/tests/validate_runtime_feature_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
