name: Git55 Requirement Goal State Contract

on:
  push:
    branches:
      - git55/requirement-goal-state-contract-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-regression:
    name: Frozen Goal Contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest and necessary imports
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile frozen contract, comparator, Blackboard and Planner
        run: >-
          python -B -m compileall -q
          source/agent_core/requirement_goal_state.py
          source/agent_core/runtime_finish_comparator.py
          source/agent_core/executor_run_blackboard.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git55_requirement_goal_state_contract.py
      - name: Goal State / Runtime Evidence / ACL-Turbo regression
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git55_requirement_goal_state_contract.py
          source/WebAgent/tests/test_git54_runtime_evidence_transparency.py
          source/WebAgent/tests/test_git53_native_scope_and_full_access.py
          source/WebAgent/tests/test_git52_native_broker_full_access_approval.py
          source/WebAgent/tests/test_git50_turbo_broker_dispatch.py
      - name: Windows Native launcher still compiles
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -Path 'install_smart_agent/turbo_appcontainer_probe.cs' -ErrorAction Stop
          [ScriptBlock]::Create([IO.File]::ReadAllText('install_smart_agent/turbo_os_execute.ps1')) | Out-Null
