name: Git27 Failure Causality and RCA Completeness

on:
  push:
    branches:
      - git27/failure-causal-receipts-collector-completeness-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-contract:
    name: Causal Receipt / Collector ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing test-import dependency
        run: python -m pip install --disable-pip-version-check playwright
      - name: Compile all affected Python source
        run: >-
          python -B -m compileall -q
          source/agent_core/failure_causal_receipt.py
          source/agent_core/prerequisite_transition_gate.py
          source/agent_core/planner_context_snapshot.py
          source/agent_core/unified_contract_transaction.py
          source/agent_core/remote_runtime_log.py
          source/agent_core/auto_rca_upload.py
          source/WebAgent/protocol_loop.py
          source/WebAgent/tests/test_git27_failure_causal_pipeline.py
          source/WebAgent/tests/test_git27_collector_causal_coverage.py
      - name: Git27 causal receipt and precommit admission
        run: python -B source/WebAgent/tests/test_git27_failure_causal_pipeline.py
      - name: Git27 real Windows Collector and full RCA zip
        run: python -B source/WebAgent/tests/test_git27_collector_causal_coverage.py
      - name: Existing Collector V3 privacy and schema regression
        run: python -B source/WebAgent/tests/validate_collect_rca_v3_it.py
      - name: Existing Telegram terminal RCA
        run: python -B source/WebAgent/tests/validate_collect_telegram_terminal_rca.py
      - name: Existing Auto RCA upload and privacy
        run: python -B source/WebAgent/tests/test_auto_rca_upload.py
      - name: Existing Planner Context bridge
        run: python -B source/WebAgent/tests/validate_planner_context_bridge_it.py
      - name: Git26 prerequisite transition and Case D
        run: python -B source/WebAgent/tests/test_git26_prerequisite_transition_gate.py
      - name: Git25 unified contract and recovery
        run: python -B source/WebAgent/tests/test_git25_unified_contract_pipeline.py
      - name: Existing CCRC and evidence guided repair
        run: python -B source/WebAgent/tests/validate_cross_contract_repair_it.py
      - name: Existing flexible Progress Admission
        run: python -B source/WebAgent/tests/validate_flexible_progress_admission.py
      - name: Existing preexecution Replan
        run: python -B source/WebAgent/tests/validate_preexecution_strategy_replan_it.py
      - name: Existing Scope and Command safety
        run: python -B source/WebAgent/tests/validate_tool_scope_hardening.py
