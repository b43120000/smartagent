name: Git42 Finish Contract Diagnostics and Repair

on:
  push:
    branches:
      - git42/finish-schema-diagnostics-repair-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile Git42 / Git41 sources
        run: >-
          python -B -m compileall -q
          source/agent_core/finish_schema_diagnostic.py
          source/agent_core/runtime_finish_comparator.py
          source/agent_core/executor_run_blackboard.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git42_finish_contract_repair.py
      - name: Git42 typed Finish diagnostics, bounded grace and fail-closed behavior
        run: python -B -m pytest source/WebAgent/tests/test_git42_finish_contract_repair.py -q
      - name: Git34–36 Finish comparator regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
          source/WebAgent/tests/test_git35_dynamic_finish_contract.py
          source/WebAgent/tests/test_git36_unified_finish_evidence.py -q
      - name: Git41 and Git40 approval regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git41_command_family_approval.py
          source/WebAgent/tests/test_git40_software_resume_approval.py -q
      - name: Git39 / Git33 Executor integration regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git39_unknown_approval_and_finish_recovery.py
          source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py -q
