name: Git30 Executor Evidence & Causal Reason Contract

on:
  push:
    branches:
      - git30/executor-evidence-reason-contract-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executor-causal-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test prerequisites
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Syntax and compilation
        run: >-
          python -B -m compileall -q
          source/agent_core/action_readiness.py
          source/agent_core/tools.py
          source/agent_core/executor_blackboard.py
          source/agent_core/tri_layer_handoff.py
          source/WebAgent/minimal_executor_contract.py
          source/WebAgent/minimal_admission.py
          source/WebAgent/minimal_core_loop.py
          source/WebAgent/minimal_resolution.py
          source/WebAgent/tests/test_git30_executor_causal_reasons.py
      - name: Git30 typed preflight and causal handoff tests
        run: python -B -m pytest source/WebAgent/tests/test_git30_executor_causal_reasons.py -q
      - name: Git29 scope and parent handoff regressions
        run: python -B -m pytest source/WebAgent/tests/test_git29_exact_scope_handoff.py -q
      - name: Git28 Unknown resolution regressions
        run: python -B -m pytest source/WebAgent/tests/test_git28_executor_resolution_blackboard.py -q
      - name: Core v10 Executor and Text Only
        run: python -B -m pytest source/WebAgent/tests/test_minimal_core_v10.py source/WebAgent/tests/test_auto_rca_upload.py -q
      - name: Case D independent verification
        run: python -B -m unittest WebAgent.tests.test_git26_minimal_deployment_terminal WebAgent.tests.test_git26_safe_operation_alias -v
      - name: Collector compatibility
        run: python -B -m pytest source/WebAgent/tests/test_minimal_core_collector_windows.py -q
      - name: Protocol manifest SHA256
        run: python -B -c "from agent_core.protocol_manifest import require_protocol_manifest; from agent_core.paths import install_root; require_protocol_manifest(install_root()); print('MANIFEST_PASS')"
