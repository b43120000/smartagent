name: Git39 Unknown Command Approval and Comparator Recovery

on:
  push:
    branches:
      - git39/unknown-command-approval-and-finish-recovery-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile modified Python
        run: >-
          python -B -m compileall -q
          source/agent_core/unknown_command_approval.py
          source/agent_core/command_risk.py
          source/agent_core/runtime_finish_comparator.py
          source/agent_core/action_dependencies.py
          source/WebAgent/minimal_admission.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/RemoteAgent/telegram_webagent_worker.py
          source/RemoteAgent/telegram_delivery.py
          source/RemoteAgent/remote_feature_catalog.py
      - name: Git39 unknown command and comparator behavior
        run: python -B -m pytest source/WebAgent/tests/test_git39_unknown_approval_and_finish_recovery.py -q
      - name: Git38 generic enum regression
        run: python -B -m pytest source/WebAgent/tests/test_git38_generic_enum_repair.py -q
      - name: Git37 admission and collector regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git37_action_admission_repair.py
          source/WebAgent/tests/test_git37_executor_admission_collector.py -q
      - name: Git26-Git27 collector regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git26_minimal_collector_live_rca.py
          source/WebAgent/tests/test_git27_collector_causal_coverage.py -q
      - name: Git33-Git36 executor and comparator regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git34_runtime_finish_comparator.py
          source/WebAgent/tests/test_git35_dynamic_finish_contract.py
          source/WebAgent/tests/test_git36_unified_finish_evidence.py -q
      - name: Minimal and Tri-One regression
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git31_single_fact_query_terminal.py
          source/WebAgent/tests/test_tri_one_egress_v10.py
          source/WebAgent/tests/test_minimal_core_v10.py -q
