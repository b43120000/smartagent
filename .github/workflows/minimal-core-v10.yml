name: Minimal Core v10 - Decision and Runtime Regression

on:
  push:
    branches:
      - refactor/pokeclaw-core-loop-20261108
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile modified core modules
        run: |
          python -m py_compile source/WebAgent/minimal_decision.py
          python -m py_compile source/WebAgent/minimal_admission.py
          python -m py_compile source/WebAgent/minimal_core_loop.py
          python -m py_compile source/WebAgent/protocol_loop.py
          python -m py_compile source/WebAgent/protocol.py
          python -m py_compile source/RemoteAgent/telegram_webagent_worker.py
          python -m py_compile source/agent_core/action_dependencies.py
      - name: Execute isolated core regressions
        env:
          PYTHONPATH: source
        run: python -m pytest source/WebAgent/tests/test_minimal_core_v10.py -v --tb=short

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile Minimal Core and Windows Runtime
        run: |
          python -m py_compile source/WebAgent/minimal_decision.py
          python -m py_compile source/WebAgent/minimal_admission.py
          python -m py_compile source/WebAgent/minimal_core_loop.py
          python -m py_compile source/RemoteAgent/telegram_webagent_worker.py
      - name: Windows real filesystem tool smoke
        env:
          PYTHONPATH: source
        run: python -m pytest source/WebAgent/tests/test_minimal_core_v10.py -v --tb=short
