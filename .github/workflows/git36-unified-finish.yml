name: Git36 Unified Finish Evidence Requirement

on:
  push:
    branches:
      - git36/unified-finish-evidence-requirement-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-finish:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile changed runtime
        run: >-
          python -B -m compileall -q
          source/agent_core/finish_evidence_requirement.py
          source/agent_core/runtime_finish_comparator.py
          source/agent_core/executor_run_blackboard.py
          source/agent_core/tri_one_runtime_terminal.py
          source/agent_core/tri_one_task_result.py
          source/agent_core/task_requirement.py
          source/agent_core/tri_one_answer_only.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git36_unified_finish_evidence.py
      - name: Git36 text tool and mixed Finish admission
        run: python -B -m pytest source/WebAgent/tests/test_git36_unified_finish_evidence.py -q
      - name: Git35 generic finish regression
        run: python -B -m pytest source/WebAgent/tests/test_git35_dynamic_finish_contract.py -q
      - name: Git34 comparator and negative-goal regression
        run: python -B -m pytest source/WebAgent/tests/test_git34_runtime_finish_comparator.py -q
      - name: Git33 executor regression
        run: python -B -m pytest source/WebAgent/tests/test_git33_pokeclaw_executor_loop.py -q
      - name: Prior fact query, text-only and Tri-One compatibility
        run: >-
          python -B -m pytest
          source/WebAgent/tests/test_git31_single_fact_query_terminal.py
          source/WebAgent/tests/test_tri_one_egress_v10.py
          source/WebAgent/tests/test_minimal_core_v10.py
          -q
      - name: Existing text-only and requirement tests
        run: >-
          python -B -m pytest
          source/WebAgent/tests/validate_tri_one_5a_answer_only.py
          source/WebAgent/tests/validate_pr0_task_requirement.py
          -q
