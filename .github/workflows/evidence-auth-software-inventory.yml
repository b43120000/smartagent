name: Evidence-Typed Artifact Access and Runtime Software Inventory

on:
  push:
    branches:
      - feat/evidence-auth-and-runtime-software-inventory-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-inventory:
    name: Access Inventory - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: error::SyntaxWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile affected source
        run: >-
          python -B -m compileall -q
          source/agent_core/source_candidate_ledger.py
          source/agent_core/source_integrity_resolution.py
          source/agent_core/source_history_registry.py
          source/agent_core/source_goal_identity.py
          source/agent_core/source_reference_index.py
          source/agent_core/historical_source_resolver.py
          source/agent_core/source_discovery_bootstrap.py
          source/agent_core/remote_artifact_access_readiness.py
          source/agent_core/runtime_software_inventory.py
          source/agent_core/metadata.py
          source/agent_core/paths.py
          source/agent_core/task_continuation.py
          source/agent_core/interrupt_readiness.py
          source/agent_core/goal_prerequisite_resolution.py
          source/agent_core/planner_context_snapshot.py
          source/WebAgent/protocol_loop.py
          source/WebAgent/tests/test_source_candidate_grounding_p0_p3.py
          source/WebAgent/tests/test_historical_source_bootstrap_recovery.py
          source/WebAgent/tests/test_source_discovery_bootstrap.py
          source/WebAgent/tests/test_remote_artifact_access_and_software_inventory.py
      - name: Access tri-state and verified software inventory
        run: python -B source/WebAgent/tests/test_remote_artifact_access_and_software_inventory.py
      - name: First-run Source Discovery Bootstrap
        run: python -B source/WebAgent/tests/test_source_discovery_bootstrap.py
      - name: Cold-start historical source regression
        run: python -B source/WebAgent/tests/test_historical_source_bootstrap_recovery.py
      - name: P0-P3 grounded source regression
        run: python -B source/WebAgent/tests/test_source_candidate_grounding_p0_p3.py
      - name: Previous Goal Prerequisite regression
        run: python -B source/WebAgent/tests/test_goal_directed_prerequisite_resolution.py
      - name: Previous Case D goal regression
        run: python -B source/WebAgent/tests/test_conditional_goal_interrupt_case_d.py
      - name: Previous Persistent Goal Gap regression
        run: python -B source/WebAgent/tests/test_goal_grounded_gap_p0_p3.py
      - name: Previous Planner Context regression
        run: python -B source/WebAgent/tests/validate_planner_context_bridge_it.py
      - name: Previous Goal Strategy Transition regression
        run: python -B source/WebAgent/tests/validate_goal_strategy_transition_it.py
      - name: Previous Context Acquisition
        run: python -B source/WebAgent/tests/validate_context_acquisition.py
      - name: Previous Action Loop regression
        run: python -B source/WebAgent/tests/validate_action_loop_runtime_state.py
      - name: Core Source Manifest integrity
        run: python -B -c "from agent_core.protocol_manifest import require_protocol_manifest; print(require_protocol_manifest('.'))"
