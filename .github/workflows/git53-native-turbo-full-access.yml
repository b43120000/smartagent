name: Git53 Native Turbo Full-Access and Builtin Toolchain

on:
  push:
    branches:
      - git53/native-turbo-full-access-readscope-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Native/legacy admission and scope / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: source
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Compile modified modules and tests
        run: >-
          python -B -m compileall -q
          source/agent_core/workspace_access.py
          source/agent_core/security_context.py
          source/agent_core/smartagent_protocol.py
          source/agent_core/tools.py
          source/agent_core/bounded_process.py
          source/agent_core/turbo_os_typed_mutations.py
          source/agent_core/turbo_execution_policy.py
          source/WebAgent/minimal_admission.py
          source/WebAgent/pokeclaw_executor_loop.py
          source/WebAgent/tests/test_git53_native_scope_and_full_access.py
      - name: Git53 native/legacy dispatch regression
        run: >-
          python -B -m pytest -q
          source/WebAgent/tests/test_git53_native_scope_and_full_access.py
          source/WebAgent/tests/test_git50_turbo_broker_dispatch.py
          source/WebAgent/tests/test_git52_native_network_toolchain.py
          source/WebAgent/tests/test_git52_action_gated_ingress_scope.py
          source/WebAgent/tests/test_git32_turbo_command_rejection_diagnostics.py
      - name: Native broker source parses on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -Path 'install_smart_agent/turbo_appcontainer_probe.cs' -ErrorAction Stop
          [ScriptBlock]::Create([IO.File]::ReadAllText('install_smart_agent/turbo_os_execute.ps1')) | Out-Null
